<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankur Rai's Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        header {
            background: #333;
            color: #fff;
            padding-top: 30px;
            min-height: 70px;
            border-bottom: #0779e4 3px solid;
        }
        header a {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 16px;
        }
        ul {
            padding: 0;
            list-style: none;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar ul {
            display: flex;
            list-style: none;
        }
        .navbar ul li {
            margin: 0 20px;
        }
        .showcase {
            min-height: 400px;
            background: url('https://via.placeholder.com/1500') no-repeat 0 -400px;
            text-align: center;
            color: #fff;
        }
        .showcase h1 {
            margin-top: 100px;
            font-size: 55px;
            margin-bottom: 10px;
        }
        .showcase p {
            font-size: 20px;
        }
        .portfolio {
            margin: 30px 0;
        }
        .portfolio img {
            width: 100%;
            height: auto;
        }
        .project {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="navbar">
                <h1>Ankur Rai</h1>
                <ul>
                    <li><a href="#about">About</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </header>
    <section class="showcase">
        <div class="container">
            <h1>Welcome to My Portfolio</h1>
            <p>Software Engineer | Machine Learning Enthusiast</p>
        </div>
    </section>
    <section id="projects" class="portfolio container">
        <h2>Projects</h2>
        <div class="project">
            <h3>CardioCare</h3>
            <img src="https://via.placeholder.com/600" alt="CardioCare">
            <p>Description of the CardioCare project.</p>
        </div>
        <div class="project">
            <h3>Memory Tile Game</h3>
            <img src="https://via.placeholder.com/600" alt="Memory Tile Game">
            <p>Description of the Memory Tile Game project.</p>
        </div>
    </section>
    <footer>
        <div class="container">
            <p>&copy; 2024 Ankur Rai. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
